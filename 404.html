<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ottawa Plated has moved to plated.gallery</title>
<meta name="robots" content="noindex">
<script>
  // ottawaplated.com has moved: send any old address to its new home on plated.gallery.
  (function () {
    var p = location.pathname, to = 'https://plated.gallery/ottawa/';
    var dish = p.match(/^\/dish\/([a-z0-9-]+)\.html$/);
    if (dish) to = 'https://plated.gallery/ottawa/dish/' + dish[1] + '.html';
    else if (/^\/(about|submit)\.html$/.test(p)) to = 'https://plated.gallery/ottawa' + p;
    else if (p === '/admin.html') to = 'https://plated.gallery/admin.html';
    location.replace(to);
  })();
</script>
<style>html{background:#0b0a08;color:#ece6d8}body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px/1.5 system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}a{color:inherit}</style>
</head>
<body>
<p>Ottawa Plated is now part of Plated.<br><a href="https://plated.gallery/ottawa/">Continue to plated.gallery/ottawa</a></p>
</body>
</html>
